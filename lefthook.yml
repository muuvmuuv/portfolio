# https://lefthook.dev/configuration/

pre-commit:
  commands:
    lint:
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx}"
      run: node_modules/.bin/oxlint {staged_files}
    format:
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,json,jsonc,css,html,md,yml,yaml,toml}"
      run: node_modules/.bin/oxfmt --check --no-error-on-unmatched-pattern {staged_files}

commit-msg:
  commands:
    lint-commit-msg:
      run: node_modules/.bin/commitlint -x "@commitlint/config-conventional" --edit
